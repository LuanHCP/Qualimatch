<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organizador de páginas</title><link rel="stylesheet" href="tool-common.css"></head><body><div class="wrap">
<header><div><h1>Organizador de páginas</h1><p>Visualize, reordene, gire ou exclua páginas e gere um novo PDF.</p></div><span class="badge">PROCESSAMENTO LOCAL</span></header>
<div class="drop" id="drop"><input id="file" type="file" accept="application/pdf,.pdf"><b>Solte um PDF aqui ou clique para selecionar</b><span>O arquivo original não será alterado</span></div>
<div class="toolbar"><div class="summary" id="summary"><span>Nenhum PDF carregado.</span></div><span class="spacer"></span><button id="reset" disabled>Restaurar</button><button id="save" class="primary" disabled>Salvar PDF organizado</button></div>
<div class="progress" id="progress" hidden><i></i></div><div class="grid" id="grid"><div class="empty">As páginas do documento aparecerão aqui.</div></div><div class="status" id="status"></div>
</div><script src="pdf-lib.min.js"></script><script type="module">
import * as pdfjsLib from './pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='./pdf.worker.min.mjs';
const $=s=>document.querySelector(s),drop=$('#drop'),input=$('#file'),grid=$('#grid'),summary=$('#summary'),save=$('#save'),reset=$('#reset'),status=$('#status'),progress=$('#progress'),bar=progress.querySelector('i');let source=null,pages=[],name='documento.pdf';
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){save.disabled=reset.disabled=!source||!pages.length;summary.innerHTML=source?`<span><b>${pages.length}</b> página(ns) mantida(s)</span><span>Arquivo: <b>${safe(name)}</b></span>`:'<span>Nenhum PDF carregado.</span>';grid.innerHTML=pages.length?pages.map((p,i)=>`<article class="item"><div class="preview"><canvas id="thumb-${p.id}"></canvas></div><div class="item-copy"><b>Página ${p.original+1}</b><small>Posição ${i+1}${p.rotation?' · giro '+p.rotation+'°':''}</small></div><div class="item-actions"><button data-left="${i}" title="Girar para esquerda">↶</button><button data-right="${i}" title="Girar para direita">↷</button><button data-up="${i}" ${i===0?'disabled':''}>↑</button><button data-down="${i}" ${i===pages.length-1?'disabled':''}>↓</button><button class="danger" data-remove="${i}">Excluir</button></div></article>`).join(''):'<div class="empty">Nenhuma página será mantida.</div>';bind();paintThumbs()}
function bind(){grid.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>rotate(+b.dataset.left,-90));grid.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>rotate(+b.dataset.right,90));grid.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));grid.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1));grid.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{pages.splice(+b.dataset.remove,1);render()})}
function move(i,d){const j=i+d;if(j<0||j>=pages.length)return;[pages[i],pages[j]]=[pages[j],pages[i]];render()}function rotate(i,d){pages[i].rotation=(pages[i].rotation+d+360)%360;render()}
async function paintThumbs(){if(!source)return;const pdf=await pdfjsLib.getDocument({data:new Uint8Array(source.slice(0))}).promise;for(const item of pages){const canvas=$('#thumb-'+item.id);if(!canvas)continue;const page=await pdf.getPage(item.original+1),vp=page.getViewport({scale:.32,rotation:item.rotation});canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise}}
async function load(file){name=file.name;source=await file.arrayBuffer();status.textContent='Lendo páginas...';progress.hidden=false;bar.style.width='20%';try{const pdf=await pdfjsLib.getDocument({data:new Uint8Array(source.slice(0))}).promise;pages=Array.from({length:pdf.numPages},(_,i)=>({id:Date.now()+'-'+i,original:i,rotation:0}));bar.style.width='100%';render();status.textContent='Documento carregado.';status.className='status ok'}catch(e){source=null;pages=[];render();status.textContent='Não foi possível abrir o PDF: '+e.message;status.className='status bad'}finally{setTimeout(()=>{progress.hidden=true;bar.style.width='0'},350)}}
save.onclick=async()=>{if(!source||!pages.length)return;save.disabled=true;status.textContent='Montando o novo PDF...';try{const src=await PDFLib.PDFDocument.load(source.slice(0)),out=await PDFLib.PDFDocument.create();for(const item of pages){const [copy]=await out.copyPages(src,[item.original]);const current=copy.getRotation().angle||0;copy.setRotation(PDFLib.degrees((current+item.rotation)%360));out.addPage(copy)}const bytes=await out.save({useObjectStreams:true}),blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name.replace(/\.pdf$/i,'')+'-organizado.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),4000);status.textContent='PDF organizado gerado com sucesso.';status.className='status ok'}catch(e){status.textContent='Falha ao gerar o PDF: '+e.message;status.className='status bad'}finally{save.disabled=false}};
reset.onclick=async()=>{if(!source)return;const pdf=await pdfjsLib.getDocument({data:new Uint8Array(source.slice(0))}).promise;pages=Array.from({length:pdf.numPages},(_,i)=>({id:Date.now()+'-'+i,original:i,rotation:0}));render();status.textContent='Ordem original restaurada.'};input.onchange=e=>{if(e.target.files[0])load(e.target.files[0]);input.value=''};drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])};render();
</script></body></html>
