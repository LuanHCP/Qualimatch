<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JFIF para PNG</title>
<style>
:root{color-scheme:dark;--bg:#0d0c16;--panel:#171522;--panel2:#201d2d;--line:#39344d;--text:#f5f2ff;--muted:#aaa4bc;--purple:#a87aff;--ok:#4bd6a0;--bad:#ff7180}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#291c43 0,transparent 34%),var(--bg);color:var(--text);font:14px/1.5 Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:38px 28px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}h1{margin:0;font-size:30px}header p{margin:6px 0 0;color:var(--muted)}.badge{padding:7px 11px;border:1px solid #59467c;border-radius:999px;color:#d8c8ff;font-size:11px;font-weight:800}.drop{position:relative;padding:36px 22px;text-align:center;border:1.5px dashed #594e76;border-radius:15px;background:#15131f;transition:.15s}.drop.drag,.drop:hover{border-color:var(--purple);background:#1b1728}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}.drop b{display:block;font-size:17px}.drop span{display:block;color:var(--muted);margin-top:5px}.actions{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px;gap:12px}.actions span{color:var(--muted)}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}button.primary{border:0;background:linear-gradient(135deg,#7047dc,var(--purple))}button:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.preview{height:180px;display:grid;place-items:center;background:#090910}.preview img{width:100%;height:100%;object-fit:contain}.copy{padding:12px}.copy b,.copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.copy small{color:var(--muted);margin:4px 0 11px}.copy button{width:100%}.status{min-height:22px;margin-top:12px;color:var(--ok)}.status.bad{color:var(--bad)}.empty{grid-column:1/-1;padding:30px;text-align:center;color:var(--muted);border:1px solid var(--line);border-radius:13px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:24px 15px}.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
 <header><div><h1>JFIF para PNG</h1><p>Converta uma ou várias imagens sem enviá-las para fora do computador.</p></div><span class="badge">PROCESSAMENTO LOCAL</span></header>
 <div class="drop" id="drop"><input id="files" type="file" accept=".jfif,image/jpeg" multiple><b>Solte arquivos .JFIF aqui ou clique para selecionar</b><span>Também aceita JPEG identificado como JFIF</span></div>
 <div class="actions"><span id="summary">Nenhuma imagem selecionada.</span><button id="downloadAll" class="primary" disabled>Baixar todos em PNG</button></div>
 <div class="grid" id="grid"><div class="empty">As imagens convertidas aparecerão aqui.</div></div>
 <div class="status" id="status"></div>
</div>
<script>
(()=>{const input=document.querySelector('#files'),drop=document.querySelector('#drop'),grid=document.querySelector('#grid'),summary=document.querySelector('#summary'),all=document.querySelector('#downloadAll'),status=document.querySelector('#status');let items=[];
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base=n=>n.replace(/\.(jfif|jpe?g)$/i,'')||'imagem';
const convert=file=>new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;canvas.getContext('2d').drawImage(img,0,0);canvas.toBlob(blob=>{URL.revokeObjectURL(url);blob?resolve({file,name:base(file.name)+'.png',blob,preview:URL.createObjectURL(blob),width:canvas.width,height:canvas.height}):reject(new Error('Falha ao gerar PNG.'))},'image/png')}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Imagem inválida ou não suportada.'))};img.src=url});
const download=item=>{const a=document.createElement('a');a.href=item.preview;a.download=item.name;document.body.appendChild(a);a.click();a.remove()};
function render(){summary.textContent=items.length?items.length+' imagem(ns) pronta(s).':'Nenhuma imagem selecionada.';all.disabled=!items.length;grid.innerHTML=items.length?items.map((x,i)=>`<article class="card"><div class="preview"><img src="${x.preview}" alt=""></div><div class="copy"><b title="${safe(x.name)}">${safe(x.name)}</b><small>${x.width} × ${x.height}px</small><button data-download="${i}">Baixar PNG</button></div></article>`).join(''):'<div class="empty">As imagens convertidas aparecerão aqui.</div>';grid.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>download(items[Number(b.dataset.download)]))}
async function add(files){status.textContent='Convertendo imagens...';status.className='status';let errors=0;for(const file of files){if(!/\.(jfif|jpe?g)$/i.test(file.name)&&file.type!=='image/jpeg'){errors++;continue}try{items.push(await convert(file))}catch{errors++}}render();status.textContent=errors?errors+' arquivo(s) não puderam ser convertido(s).':'Conversão concluída.';status.className='status'+(errors?' bad':'')}
input.onchange=e=>{add([...e.target.files]);input.value=''};drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');add([...e.dataTransfer.files])};all.onclick=async()=>{for(const item of items){download(item);await new Promise(r=>setTimeout(r,180))}};
})();
</script>
</body>
</html>
